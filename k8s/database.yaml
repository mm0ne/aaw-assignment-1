# Repeat for each StatefulSet
# marketplace-auth-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: marketplace-auth-db
  namespace: marketplace
spec:
  serviceName: "marketplace-auth-db"
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-auth-db
  template:
    metadata:
      labels:
        app: marketplace-auth-db
    spec:
      nodeSelector:
        type: microservice
      containers:
        - name: postgres
          image: postgres:latest
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          resources:
            limits:
              cpu: "150m"
              memory: "150Mi"
            requests:
              cpu: "100m"
              memory: "100Mi"
          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: auth-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

