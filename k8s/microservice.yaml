apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-auth
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-auth
  template:
    metadata:
      labels:
        app: marketplace-auth
    spec:
      nodeSelector:
        type: microservice
      containers:
        - name: marketplace-auth
          image: rhfrhf/marketplace-auth:latest

          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "marketplace-auth-db"
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: ADMIN_JWT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: JWT_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: DB_PASSWORD
            - name: ADMIN_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: ADMIN_TENANT_ID
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: TENANT_ID
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: DB_NAME
          resources:
            limits:
              cpu: "250m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "100Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
